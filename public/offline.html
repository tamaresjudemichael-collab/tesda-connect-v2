<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f766e">
  <title>Offline - TESDA Connect</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f8fafc; color: #0f172a; box-sizing: border-box; }
    main { width: min(100%, 560px); padding: 32px; box-sizing: border-box; background: white; border: 1px solid #e2e8f0; border-radius: 24px; box-shadow: 0 20px 50px rgb(15 23 42 / 8%); }
    .mark { display: grid; place-items: center; width: 56px; height: 56px; border-radius: 16px; color: white; background: #0f766e; font-weight: 800; letter-spacing: -.04em; }
    h1 { margin: 22px 0 8px; font-size: clamp(1.5rem, 4vw, 2rem); }
    p { color: #475569; line-height: 1.65; }
    .note { padding: 14px 16px; border-radius: 12px; background: #f1f5f9; font-size: .9rem; }
    button { margin-top: 12px; border: 0; border-radius: 12px; padding: 12px 18px; background: #0f766e; color: white; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">TC</div>
    <h1>You’re offline</h1>
    <p>TESDA Connect cannot reach the server right now. Reconnect to the internet and retry to continue using the application.</p>
    <p class="note"><strong>Your data is safe:</strong> this offline page does not submit or queue form changes. Do not assume a form was saved until the application confirms it.</p>
    <button type="button" onclick="window.location.reload()">Try again</button>
  </main>
</body>
</html>
